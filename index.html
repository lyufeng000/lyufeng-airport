<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="Network service pricing.">
  <meta name="theme-color" content="#070b18">
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">
  <title>Network Service Pricing</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #f7f9ff;
      background: #070b18;
      font-synthesis: none;
      line-height: 1.35;
    }

    * { box-sizing: border-box; }

    body {
      min-block-size: 100dvh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: clamp(28px, 6vw, 72px) 20px;
      background:
        radial-gradient(circle at 50% -10%, rgb(39 101 255 / 34%), transparent 42%),
        radial-gradient(circle at 5% 95%, rgb(0 187 255 / 12%), transparent 30%),
        linear-gradient(145deg, #050713 0%, #0a1530 54%, #070b18 100%);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.18;
      background-image:
        linear-gradient(rgb(255 255 255 / 5%) 1px, transparent 1px),
        linear-gradient(90deg, rgb(255 255 255 / 5%) 1px, transparent 1px);
      background-size: 64px 64px;
      mask-image: linear-gradient(to bottom, black, transparent 76%);
    }

    main {
      position: relative;
      z-index: 1;
      inline-size: min(100%, 900px);
      text-align: center;
    }

    .visually-hidden {
      position: absolute;
      inline-size: 1px;
      block-size: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
      border: 0;
    }

    .brand-icon {
      display: block;
      inline-size: clamp(92px, 12vw, 122px);
      block-size: auto;
      aspect-ratio: 1;
      margin: 0 auto -34px;
      position: relative;
      z-index: 2;
      filter: drop-shadow(0 18px 24px rgb(0 48 255 / 32%));
    }

    .plans {
      padding: clamp(50px, 7vw, 68px) clamp(22px, 5vw, 48px) clamp(18px, 3vw, 28px);
      border: 1px solid rgb(255 255 255 / 12%);
      border-radius: clamp(26px, 4vw, 40px);
      background: rgb(9 18 41 / 88%);
      box-shadow:
        0 40px 100px rgb(0 0 0 / 45%),
        inset 0 1px 0 rgb(255 255 255 / 7%);
      backdrop-filter: blur(20px);
    }

    .plan {
      display: grid;
      grid-template-columns: minmax(220px, 0.82fr) minmax(390px, 1.18fr);
      align-items: center;
      gap: clamp(28px, 5vw, 64px);
      padding: clamp(26px, 4vw, 42px) 0;
    }

    .plan + .plan { border-block-start: 1px solid rgb(255 255 255 / 10%); }

    .allowance {
      margin: 0;
      display: flex;
      align-items: baseline;
      justify-content: center;
      gap: 10px;
      white-space: nowrap;
    }

    .allowance strong {
      font-size: clamp(3.75rem, 8vw, 5.4rem);
      font-weight: 760;
      line-height: 0.92;
      letter-spacing: -0.065em;
    }

    .allowance span {
      color: #9eaccb;
      font-size: clamp(1rem, 2vw, 1.2rem);
      font-weight: 600;
      line-height: 1.2;
      text-align: start;
    }

    .prices {
      margin: 0;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
      align-items: center;
      gap: clamp(10px, 2vw, 18px);
      font-variant-numeric: tabular-nums;
    }

    .price {
      min-inline-size: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-block-size: 112px;
      padding: 16px;
      border: 1px solid rgb(255 255 255 / 10%);
      border-radius: 22px;
      background: rgb(255 255 255 / 4%);
    }

    .price strong {
      font-size: clamp(1.8rem, 4vw, 2.65rem);
      line-height: 1;
      letter-spacing: -0.045em;
    }

    .price span {
      margin-block-start: 8px;
      color: #98a7c7;
      font-size: 1rem;
      font-weight: 600;
    }

    .price.yearly {
      border-color: rgb(104 157 255 / 48%);
      background: linear-gradient(145deg, #1458e7, #3576ff);
      box-shadow: 0 16px 36px rgb(24 92 242 / 28%);
    }

    .price.yearly span { color: #dfe9ff; }

    .or {
      color: #71809f;
      font-size: 1rem;
      font-weight: 700;
      text-transform: lowercase;
    }

    .contact {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-block-size: 58px;
      margin-block-start: 26px;
      padding-inline: 26px;
      border: 1px solid rgb(255 255 255 / 14%);
      border-radius: 999px;
      color: #f5f8ff;
      background: rgb(255 255 255 / 6%);
      font-size: clamp(1.05rem, 2.5vw, 1.25rem);
      font-weight: 650;
      text-decoration: none;
      overflow-wrap: anywhere;
      transition: border-color 160ms ease, background-color 160ms ease, transform 160ms ease;
    }

    .contact:hover {
      border-color: rgb(112 164 255 / 65%);
      background: rgb(57 111 229 / 17%);
      transform: translateY(-2px);
    }

    .contact:focus-visible {
      outline: 3px solid #8db4ff;
      outline-offset: 4px;
    }

    @media (max-width: 760px) {
      body { place-items: start center; }

      .plan {
        grid-template-columns: 1fr;
        gap: 24px;
      }

      .allowance strong { font-size: clamp(3.5rem, 18vw, 5rem); }
    }

    @media (max-width: 430px) {
      body { padding-inline: 14px; }

      .plans {
        padding-inline: 16px;
        border-radius: 26px;
      }

      .plan { padding-block: 28px; }

      .prices { gap: 8px; }

      .price {
        min-block-size: 104px;
        padding: 14px 8px;
        border-radius: 18px;
      }

      .price strong { font-size: clamp(1.55rem, 8vw, 2rem); }
      .price span { font-size: 1rem; }
      .contact { inline-size: 100%; }
    }

    @media (prefers-reduced-motion: reduce) {
      .contact { transition: none; }
    }
  </style>
</head>
<body>
  <main>
    <h1 class="visually-hidden">Network service pricing</h1>
    <img class="brand-icon" src="icon.png" alt="" width="256" height="256" fetchpriority="high">

    <section class="plans" aria-label="Pricing options">
      <article class="plan">
        <p class="allowance"><strong>100</strong><span>GB /<br>month</span></p>
        <p class="prices">
          <span class="price"><strong>￥9.9</strong><span>/ month</span></span>
          <span class="or">or</span>
          <span class="price yearly"><strong>￥99</strong><span>/ year</span></span>
        </p>
      </article>

      <article class="plan">
        <p class="allowance"><strong>200</strong><span>GB /<br>month</span></p>
        <p class="prices">
          <span class="price"><strong>￥16.9</strong><span>/ month</span></span>
          <span class="or">or</span>
          <span class="price yearly"><strong>￥169</strong><span>/ year</span></span>
        </p>
      </article>
    </section>

    <a class="contact" href="mailto:lyufeng000@gmail.com">lyufeng000@gmail.com</a>
  </main>
</body>
</html>
